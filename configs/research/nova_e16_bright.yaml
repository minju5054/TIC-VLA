hospital_validation:
  first_primary_request_id: 4
  minimum_consecutive_left_requests: 2
  position_sign_tolerance_m: 1.0e-06
  angle_sign_tolerance_rad: 1.0e-06
  command_sign_tolerance_rad_s: 1.0e-06
  minimum_segment_length_m: 1.0e-06
  camera_probe_radius_m: 0.02
  near_black_p95_0_255: 20.0
  maximum_settling_xy_m: 0.02
  native_waypoint_dt: 0.1
  horizon_policy: 48 fixed predictions at 2 Hz target cadence; approximately 24 seconds
    plus bootstrap/call overrun; never extend after output
  stable_left_rule: 'Two consecutive primary requests: endpoint+mean left positive,
    lookahead left+bearing positive, controller w positive, derived total heading
    change positive; exclude degraded near-black observations'
  forward_dominance_rule: Endpoint forward > abs(left), lookahead forward > abs(left),
    not weak left (fewer than 3 of 4 left indicator groups)
  execution_rule: Forward progress precedes stable predicted intent; later two consecutive
    measured observation intervals each have positive yaw change and episode-local
    left-dominant displacement (left component > abs(forward)); no degraded RGB, camera
    proximity hit or non-floor contact during qualifying intervals. Non-floor contact
    means measured environment contact with abs(normal.z) < 0.5, retained until CONTACT_LOST.
    This is a conservative execution criterion, not a turn magnitude threshold chosen
    from model results.
