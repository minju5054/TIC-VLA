  stable_left_rule: 'Two consecutive primary requests: endpoint+mean left positive,
    lookahead left+bearing positive, controller w positive, derived total heading
    change positive; exclude degraded near-black observations'
  forward_dominance_rule: Endpoint forward > abs(left), lookahead forward > abs(left),
    not weak left (fewer than 3 of 4 left indicator groups)
  execution_rule: Forward progress precedes stable predicted intent; later two consecutive
    measured observation intervals each have positive yaw change and episode-local
    left-dominant displacement (left component > abs(forward)); no degraded RGB,
    camera proximity hit or non-floor contact during qualifying intervals. Non-floor
    contact means measured environment contact with abs(normal.z) < 0.5, retained
    until CONTACT_LOST. This is a conservative execution criterion, not a turn
    magnitude threshold chosen from model results.
